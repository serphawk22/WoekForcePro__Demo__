[project]
name = "workforce-pro-api"
version = "0.1.0"
description = "WorkForce Pro FastAPI backend (Vercel Python runtime)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.109.0",
    "uvicorn[standard]==0.27.0",
    "sqlmodel==0.0.34",
    "psycopg2-binary==2.9.12",
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "bcrypt==4.0.1",
    "python-dotenv==1.0.0",
    "python-multipart==0.0.6",
    "pydantic[email]==2.13.5",
    "openai>=1.30.0,<2.0.0",
    "apscheduler>=3.10.4,<4.0.0",
]

[tool.vercel]
entrypoint = "api.index:app"