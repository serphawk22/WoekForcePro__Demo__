name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-import:
    name: Backend — imports
    runs-on: ubuntu-latest
    env:
      # Importing app.main builds the SQLAlchemy engine lazily; no connection is made.
      DATABASE_URL: "postgresql://ci:ci@127.0.0.1:5432/ci"
      SECRET_KEY: "ci-secret-key-for-import-check"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Verify Vercel function entrypoint imports
        run: |
          python -c "import sys; sys.path.insert(0, 'backend'); from app.main import app; assert app.title == 'WorkForce Pro API'; print('OK: app.main imports and serves FastAPI')"
      - name: Verify api/index.py (Vercel ASGI handler) imports
        run: |
          python -c "import api.index as _m; assert hasattr(_m, 'app'); print('OK: api/index.py exposes app')"

  backend-migrations:
    name: Backend — DB bootstrap on PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: workforcepro
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d workforcepro"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: "postgresql://postgres:postgres@127.0.0.1:5432/workforcepro"
      SECRET_KEY: "ci-secret-key-for-migrations"
      SHEET_REMINDER_SCHEDULER_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Boot the API (runs startup bootstrap) and wait for /health
        run: |
          cd backend
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > uvicorn.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -sf http://127.0.0.1:8000/health > /dev/null; then
              echo "API healthy after ${i} checks"
              break
            fi
            if ! kill -0 %1 2>/dev/null; then
              echo "API process exited early:"; cat uvicorn.log; exit 1
            fi
            sleep 2
          done
          curl -sf http://127.0.0.1:8000/health || { echo "API did not become healthy"; cat uvicorn.log; exit 1; }

  frontend-build:
    name: Frontend — production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build